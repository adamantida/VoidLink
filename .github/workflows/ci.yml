name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace --release

      - name: Build individual crates
        run: |
          cargo build --package tunnel-protocol --release
          cargo build --package tunnel-client --release
          cargo build --package tunnel-server --release
          cargo build --package tunnel-daemon --release
          cargo build --package tunnel-ipc --release

  # Windows-specific checks
  windows-checks:
    name: Windows Specific
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ hashFiles('**/Cargo.lock') }}

      - name: Build with features
        run: cargo build --workspace --release --features wintun

      - name: Check service binary exists
        run: |
          if (Test-Path "target/release/tunnel-client.exe") {
            Write-Host "tunnel-client.exe found"
          } else {
            Write-Error "tunnel-client.exe NOT found"
            exit 1
          }

  # Release preparation (manual trigger)
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/release/tunnel-client dist/tunnel-client-linux
          cp target/release/tunnel-server dist/tunnel-server-linux
          cp target/release/tunnel-daemon dist/tunnel-daemon-linux
          tar -czf dist/voidlink-linux-${{ github.ref_name }}.tar.gz -C dist tunnel-client-linux tunnel-server-linux tunnel-daemon-linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voidlink-linux-${{ github.ref_name }}
          path: dist/voidlink-linux-${{ github.ref_name }}.tar.gz

  # Documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate docs
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: target/doc