[package]
name = "tunnel-server"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
tunnel-protocol = { path = "../protocol" }
anyhow.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook = "0.3"
bincode = "1.3"
ed25519-dalek = { version = "3", features = ["serde"] }
x25519-dalek = { version = "3", features = ["static_secrets", "serde"] }
serde_bytes = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
