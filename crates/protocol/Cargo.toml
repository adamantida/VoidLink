[package]
name = "tunnel-protocol"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
anyhow.workspace = true
blake3.workspace = true
bincode = "1"
chacha20poly1305.workspace = true
rand.workspace = true
ed25519-dalek = "3"
x25519-dalek = { version = "3", features = ["static_secrets"] }
serde = { workspace = true, features = ["derive"] }
serde_bytes = "0.11"

[features]
# Serialize/Deserialize для полезных нагрузок, которые несут события движка
# (GroupSummary, FriendGroup) — для IPC демона (PLAN.md 7.1).
serde = []
